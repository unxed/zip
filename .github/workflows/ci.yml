name: CI

on:
  # Branches only. A release tag points at a commit the branch push has
  # already built, so an unfiltered `push` fans that one commit out into two
  # independent runs of the whole matrix, and concurrency cannot fold them
  # together because the group keys on the ref. '**' matches every branch,
  # slashes included, and no tag at all.
  push:
    branches: ['**']
  pull_request:

# Nothing in this workflow writes anything back: every job checks the tree out,
# builds it and runs it. Naming read here keeps a token that could push, tag or
# comment out of every step, whatever the repository or the organisation hands
# out by default.
permissions:
  contents: read

# A push fans out into dozens of checks, and only the latest queued run for a
# branch and event is useful. Preserve every main run: its history must never
# be interrupted.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Test (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Every job carries a bound of its own. The default is six hours, which is
    # not a timeout so much as a way to hold a runner all morning: a hang here
    # is a bug in the suite, and the go test -timeout inside the step only
    # covers a hang in a test, not one in checkout, in the toolchain download
    # or in the compile.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Runtime coverage is deliberately narrower than the platform reach of
        # the package. FreeBSD is run as well, in the virtual machine the job
        # right below boots, because no hosted runner offers it. Every GOOS
        # beyond those lives in the build matrix further down, which compiles
        # the platform files (fs_*.go, sys_*.go) and vets them without running
        # them.
        #
        # linux/386 is the one cell that is not the runner's own architecture.
        # It runs there because a 32-bit int is a different int: the package
        # reads counts and lengths out of archives and computes with them, and
        # a product that is comfortably inside an int64 wraps in an int32,
        # which is a bounds check that passes for a buffer that cannot hold
        # what it just allowed. Nothing about that shows up on a 64-bit cell,
        # and the build matrix only compiles 386, which is not where the
        # arithmetic is. The binaries are static and pure Go, so an amd64
        # runner executes them as they are.
        include:
          - { os: ubuntu-latest,    target: linux/amd64,   goos: linux,   goarch: amd64 }
          - { os: ubuntu-latest,    target: linux/386,     goos: linux,   goarch: "386" }
          - { os: ubuntu-24.04-arm, target: linux/arm64,   goos: linux,   goarch: arm64 }
          - { os: windows-latest,   target: windows/amd64, goos: windows, goarch: amd64 }
          - { os: macos-latest,     target: darwin/arm64,  goos: darwin,  goarch: arm64 }
          - { os: macos-15-intel,   target: darwin/amd64,  goos: darwin,  goarch: amd64 }
    env:
      # The package is pure Go. Pinning this keeps every runner on the same
      # configuration instead of letting each one decide by whether it happens
      # to ship a C toolchain.
      CGO_ENABLED: 0
      # Named for every cell rather than only the one that differs, so a cell
      # never inherits an architecture from the runner it happens to land on.
      GOARCH: ${{ matrix.goarch }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      # -shuffle=on on every cell, not just the ones where an ordering bug has
      # already bitten: order independence is a property of the suite. The
      # seed is printed as `-test.shuffle N`, so any failure here reproduces
      # locally with -shuffle=N.
      # The run is instrumented, and every test binary writes its own counter
      # and meta files into one directory. That is the raw form the toolchain
      # merges across platforms; a textual profile per cell could not be
      # merged, because each cell compiles a different set of files.
      - name: Test
        run: |
          mkdir -p "$RUNNER_TEMP/covdata"
          go test -count=1 -shuffle=on -timeout 10m \
            -cover -coverpkg=./... ./... \
            -args -test.gocoverdir="$RUNNER_TEMP/covdata"

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: covdata-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/covdata
          retention-days: 1
          if-no-files-found: error

  # A seventh test cell, split out only because it cannot share the matrix
  # above: GitHub hosts no FreeBSD runner, so this one boots a FreeBSD guest
  # under QEMU on an Ubuntu runner and runs the suite inside it. Everything
  # else about it is the same -- the same flags, the same counter data, the
  # same artifact -- and the coverage job treats it as an equal: sys_freebsd.go
  # is measured here or it is not measured at all.
  test-freebsd:
    name: Test (freebsd/amd64)
    runs-on: ubuntu-latest
    # The guest boots, fetches a toolchain and finishes the suite in about a
    # minute. The bound is wide because the go test -timeout below covers only
    # the suite: a stall in the boot or in the download is outside it.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The action and the release are pinned for the reason the Go version is
      # pinned everywhere else here: a cell that quietly changes what it runs
      # stops reporting on the same thing twice.
      #
      # The toolchain is fetched rather than installed from packages, because
      # pkg would supply whatever version the release happens to carry, and
      # this cell has to be on the same Go as the six above it. The guest
      # shares the workspace, so the counter files the suite writes are on the
      # runner's own disk by the time this step returns.
      - name: Test
        uses: vmactions/freebsd-vm@v1.5.5
        with:
          release: '14'
          usesh: true
          prepare: |
            fetch -o /tmp/go.tar.gz https://go.dev/dl/go1.25.14.freebsd-amd64.tar.gz
            tar -C /usr/local -xzf /tmp/go.tar.gz
          run: |
            export PATH=/usr/local/go/bin:$PATH
            export CGO_ENABLED=0
            mkdir -p covdata
            go test -count=1 -shuffle=on -timeout 10m \
              -cover -coverpkg=./... ./... \
              -args -test.gocoverdir="$(pwd)/covdata"

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: covdata-freebsd-amd64
          path: covdata
          retention-days: 1
          if-no-files-found: error

  coverage:
    name: Coverage
    needs: [test, test-freebsd]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # id-token: write is the one permission beyond the workflow's read-only
    # default, and only this job gets it: codecov-action uses it to mint an
    # OIDC token for the upload below, so no CODECOV_TOKEN secret is needed.
    permissions:
      contents: read
      id-token: write
    env:
      CGO_ENABLED: 0
      # The one file no cell builds: sys_other.go is the fallback for the
      # platforms the linux, freebsd, darwin and windows files leave unclaimed,
      # so nothing that runs anywhere in this workflow compiles it. It is
      # named rather than skipped by pattern: the check below demands that
      # every other file in the module appears in the merged profile, so a
      # file that quietly stops being built by any cell -- or a new
      # platform-only file -- fails this job until someone puts it on this
      # list on purpose. sys_freebsd.go was on it until the FreeBSD cell
      # started running, and taking it off is what makes that cell load
      # bearing: drop the cell and this job fails.
      UNBUILT: sys_other.go
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - uses: actions/download-artifact@v4
        with:
          pattern: covdata-*
          path: covdata

      # One cell compiles fs_windows.go, another fs_unix.go, a third
      # sys_darwin.go, a fourth sys_freebsd.go, and all seven compile
      # reader.go. Merging the raw counter data is what unifies those into a
      # single profile in which a block is covered if any cell reached it.
      - name: Merge coverage data
        run: |
          dirs=$(printf '%s,' covdata/*/)
          mkdir -p merged
          go tool covdata merge -i="${dirs%,}" -o=merged
          go tool covdata textfmt -i=merged -o=merged.txt

      # The merged profile goes to Codecov for per-file history and PR
      # annotations. The gate stays the step below; Codecov is a report, so a
      # failed upload (a fork PR, which is granted no id-token, or a Codecov
      # outage) must not turn the job red. It runs before the gate so that a
      # regression is visible there too, not only in this job's log.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: merged.txt
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

      # A file with no statements at all is invisible to coverage, so the
      # expectation is stated over the files that declare a function.
      - name: Check every built file is measured
        run: |
          module=$(go list -m)
          git ls-files '*.go' | grep -v '_test\.go$' | xargs grep -l '^func ' \
            | sort > want.txt
          for f in $UNBUILT; do echo "$f"; done | sort > unbuilt.txt
          comm -23 want.txt unbuilt.txt > expected.txt
          sed -n '2,$p' merged.txt | cut -d: -f1 | sed "s|^$module/||" \
            | sort -u > measured.txt
          missing=$(comm -23 expected.txt measured.txt)
          extra=$(comm -13 expected.txt measured.txt)
          if [ -n "$missing" ]; then
            echo "Built by no test cell, and not on the UNBUILT list:"
            echo "$missing"
          fi
          if [ -n "$extra" ]; then
            echo "Measured although listed as unbuilt:"
            echo "$extra"
          fi
          if [ -n "$missing$extra" ]; then
            echo "::error::the set of measured files does not match the module"
            exit 1
          fi

      # The merge already unifies a block that several cells compiled, but the
      # sum is what the report is built from either way, and it is what keeps
      # this honest if a future toolchain emits the same block once per build.
      - name: Require every statement covered
        run: |
          module=$(go list -m)
          awk 'NR > 1 { s[$1] = $2; c[$1] += $3 }
               END { for (k in s) { t += s[k]; if (c[k] > 0) cv += s[k] }
                     printf "%d %d\n", cv, t }' merged.txt > totals.txt
          awk 'NR > 1 { s[$1] = $2; c[$1] += $3 }
               END { for (k in s) if (c[k] == 0) print k }' merged.txt \
            | sort > uncovered.txt
          read -r covered total < totals.txt
          echo "covered $covered of $total statements in $(wc -l < uncovered.txt) uncovered blocks"
          if [ ! -s uncovered.txt ]; then
            echo "::notice::every statement the test cells compile is covered"
            exit 0
          fi
          while read -r block; do
            file=${block%%:*}
            span=${block#*:}
            first=${span%%.*}
            last=${span#*,}
            last=${last%%.*}
            path=${file#"$module/"}
            echo "::group::$path:$first-$last"
            sed -n "$first,${last}p" "$path"
            echo "::endgroup::"
          done < uncovered.txt
          echo "::group::coverage by function"
          go tool covdata func -i=merged
          echo "::endgroup::"
          echo "::error::$((total - covered)) uncovered statements"
          exit 1

  race:
    name: Race
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The rest of this workflow intentionally keeps cgo disabled. Enabling
      # it here does not reverse that decision: the race detector requires it.
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      # -shuffle=on here too: order independence is a property of the suite,
      # and this cell is the one that runs it with the detector attached.
      - run: go test -race -count=1 -shuffle=on -timeout 20m ./...

  formatting:
    name: Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - name: Check gofmt
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "The following files are not gofmt-clean:"
            gofmt -s -l .
            echo
            echo "Run 'gofmt -s -w .' to fix."
            exit 1
          fi

  lint:
    name: Lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # A linter only ever sees the files the build constraints select, so
        # one cell reports on one platform's code and says nothing at all
        # about the others. linux and windows are here because that is where
        # fs_linux.go, sys_linux.go, fs_windows.go and sys_windows.go live,
        # and darwin because sys_darwin.go and its half of sys_unix.go are
        # compiled by neither of the other two.
        #
        # freebsd is here for sys_freebsd.go. The test job does run that file,
        # in a virtual machine, but a linter reads source rather than a
        # running system, so this cell needs no machine of its own and costs
        # only its minute.
        goos: [linux, windows, darwin, freebsd]
    env:
      CGO_ENABLED: 0
      # Named at the job rather than passed as an argument: the action runs
      # the linter itself, and the linter reads the environment.
      GOOS: ${{ matrix.goos }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      # No args: the configuration is .golangci.yml, whole-tree and identical
      # to the one every other repository here uses, and the backlog it
      # reports is zero. There is nothing to narrow the run down to.
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.1

  vulnerabilities:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      # go.mod sets the minimum language version, while govulncheck checks the
      # standard library used for the build, so CI needs the latest patch.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/*.yml

  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The package compiles for every GOOS with a POSIX-ish syscall surface
        # plus Windows: fs_windows.go and sys_windows.go cover Windows,
        # fs_linux.go and sys_linux.go cover Linux, sys_darwin.go and
        # sys_freebsd.go cover those two, and fs_unix.go, sys_other.go and
        # fs_prealloc_fallback.go catch everything else. js, wasip1 and plan9
        # are absent on purpose: fs_unix.go reaches for Fchmodat and
        # AT_SYMLINK_NOFOLLOW, which x/sys/unix does not define there.
        #
        # The architecture spread is not decoration: the Linux device metadata
        # code is written twice, once per dev_t width, so a target of each
        # width has to be compiled for either half to be looked at.
        #
        # The pairs are batched three ways rather than run one job apiece.
        # Compiling this package for one target takes seven to ten seconds
        # while a runner needs thirty to sixty just to start and install Go,
        # so a job per pair spends most of its life on overhead and 32 of them
        # do not fit the concurrency limit in one wave.
        include:
          - name: linux
            targets: >-
              linux/amd64 linux/arm64 linux/arm linux/386
              linux/riscv64 linux/ppc64le linux/s390x linux/mips64le
          - name: windows, darwin, android
            targets: >-
              windows/amd64 windows/arm64 windows/386
              darwin/amd64 darwin/arm64 android/arm64
          - name: bsd, illumos, solaris, aix
            targets: >-
              freebsd/amd64 freebsd/arm64 netbsd/amd64 openbsd/amd64
              dragonfly/amd64 illumos/amd64 solaris/amd64 aix/ppc64
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'

      # Every target in the batch reports, so one failure does not hide the
      # rest: the loop records what failed and the job fails once at the end,
      # with an annotation naming the pairs the job name no longer names.
      #
      # `go vet` type-checks the test files too, and unix_advanced_test.go
      # calls unix.Setxattr, which x/sys/unix leaves undefined on openbsd,
      # dragonfly, illumos, solaris and aix. Those five are built but not
      # vetted; vetting is not the platform claim this job makes.
      - name: Build and vet
        env:
          TARGETS: ${{ matrix.targets }}
        run: |
          failed=
          for target in $TARGETS; do
            GOOS=${target%/*}
            GOARCH=${target#*/}
            export GOOS GOARCH
            echo "::group::$target"
            go build ./... || failed="$failed $target(build)"
            case "$GOOS" in
              openbsd|dragonfly|illumos|solaris|aix)
                echo "vet skipped: x/sys/unix defines no Setxattr on $GOOS"
                ;;
              *)
                go vet ./... || failed="$failed $target(vet)"
                ;;
            esac
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "::error::build or vet failed for:$failed"
            exit 1
          fi
